<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Gideon Abochie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0b0b0f;--surface:#121216;--border:#1f1f28;--accent:#e63946;--accent2:#ff4d5a;--text:#f0f0f0;--text-dim:#8a8a95;--red:#ef4444;--green:#22c55e}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}

    .login-wrap{width:100%;max-width:400px;padding:24px}
    .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 32px}
    .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
    .login-logo svg{flex-shrink:0}
    .login-logo-text{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
    .login-logo-text span{color:var(--accent)}

    h1{font-size:1.5rem;font-weight:800;margin-bottom:8px}
    .login-sub{color:var(--text-dim);font-size:.9rem;margin-bottom:28px}

    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
    .form-group input{width:100%;padding:12px 16px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;font-family:inherit;outline:none;transition:border-color .2s}
    .form-group input:focus{border-color:var(--accent)}
    .form-group input::placeholder{color:#555}
    .pw-wrap{position:relative}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-dim);cursor:pointer;padding:4px;font-size:1.1rem;line-height:1}
    .pw-toggle:hover{color:var(--text)}

    .login-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;margin-top:8px}
    .login-btn:hover{background:var(--accent2);transform:translateY(-1px)}
    .login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .login-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:12px;margin-top:16px;color:var(--red);font-size:.85rem;display:none}
    .login-error.show{display:block}

    .login-footer{text-align:center;margin-top:24px;color:var(--text-dim);font-size:.8rem}
    .login-footer a{color:var(--accent);text-decoration:none}

    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="10" fill="#e63946"/>
        <circle cx="20" cy="20" r="13" fill="#000"/>
        <text x="20" y="25" text-anchor="middle" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" transform="rotate(-45 20 20)">GA</text>
      </svg>
      <div class="login-logo-text">Gideon <span>Abochie</span></div>
    </div>

    <h1>Admin Login</h1>
    <p class="login-sub">Sign in to access the dashboard.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@gideonabochie.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">👁</button>
        </div>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
  <div class="login-footer">
    <a href="index.html">← Back to site</a>
  </div>
</div>

<script src="https://browser.sentry-cdn.com/7.120.0/bundle.min.js" crossorigin="anonymous"></script>
<script>Sentry.init({ dsn: 'https://YOUR_KEY@o0.ingest.sentry.io/0' });</script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('loginBtn');
  var error = document.getElementById('loginError');

  // Init Firebase Auth only (no Firestore needed for login)
  AuthService.init();

  // If already logged in, redirect to admin
  AuthService.onAuthStateChanged(function (user) {
    if (user) {
      window.location.href = 'admin.html';
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!email || !password) {
      showError('Please enter email and password.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';
    error.classList.remove('show');

    AuthService.login(email, password)
      .then(function (cred) {
        console.log('[Login] Success:', cred.user.email);
        window.location.href = 'admin.html';
      })
      .catch(function (err) {
        console.error('[Login] Error:', err.code, err.message);
        var msg = 'Login failed: ' + (err.code || err.message);
        if (err.code === 'auth/user-not-found') msg = 'No account found with this email.';
        else if (err.code === 'auth/wrong-password') msg = 'Incorrect password.';
        else if (err.code === 'auth/invalid-email') msg = 'Invalid email address.';
        else if (err.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
        else if (err.code === 'auth/invalid-credential') msg = 'Invalid email or password.';
        else if (err.code === 'auth/network-request-failed') msg = 'Network error — check your connection.';
        else if (err.code === 'auth/api-key-not-valid') msg = 'Firebase API key invalid.';
        showError(msg);
        btn.disabled = false;
        btn.textContent = 'Sign In';
      });
  });

  function showError(msg) {
    error.textContent = msg;
    error.classList.add('show');
  }

  // Password toggle
  var pwToggle = document.getElementById('pwToggle');
  var pwInput = document.getElementById('password');
  pwToggle.addEventListener('click', function () {
    var isPassword = pwInput.type === 'password';
    pwInput.type = isPassword ? 'text' : 'password';
    pwToggle.textContent = isPassword ? '🔒' : '👁';
  });
})();
</script>

</body>
</html>
