[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://image.thum.io; connect-src 'self' https://api.allorigins.win https://www.googleapis.com; frame-src 'self';"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/redesigns/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=86400"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.{js,css}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/old-portal"
  to = "/portal.html"
  status = 301

[[redirects]]
  from = "/finder"
  to = "/admin.html"
  status = 301

[[redirects]]
  from = "/outdated-websites"
  to = "/admin.html"
  status = 301

[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    audits = [
      { threshold = 0.9, scoring = "median" },
      { threshold = 0.5, scoring = "p10" }
    ]
