# Cloudflare Pages project config (local dev + D1 binding for Remote Jobs).
# The site deploys via Cloudflare Pages git integration; stage is ./.
# The RJ_DB binding must also be added in the Pages dashboard (Settings > Functions > D1).
compatibility_date = "2026-09-19"
pages_build_output_dir = "."

[[d1_databases]]
binding = "RJ_DB"
database_name = "gabochie-db"
# Reused shared DB (D1 limit reached). Split to remote-jobs-db later after deleting unused D1:
#   wrangler d1 delete <unused> then wrangler d1 create remote-jobs-db
database_id = "f5c24c14-705f-4a38-84b4-19d6a6904e7f"